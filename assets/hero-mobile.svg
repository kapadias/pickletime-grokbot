<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560" role="img" aria-labelledby="t d">
<title id="t">PickleTime Bot: automatic CourtReserve pickleball court booking for Grok Bot</title>
<desc id="d">A pickleball court seen from above, a clock reading 12:00:00, and a chat message from PickleTime Bot that reads: BOOKED Saturday 21 November at 6:30 PM for 60 minutes.</desc>
<style>.s{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}.tx{fill:#eef3fb}.mu{fill:#a9b6cc}.fa{fill:#7f8ea8}.gr{fill:#7ee08a}.b{font-weight:700}.sb{font-weight:600}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.pulse{animation:pulse 2.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:1}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1424"/><stop offset="1" stop-color="#11203a"/></linearGradient>
<linearGradient id="court" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f6b5a"/><stop offset="1" stop-color="#18574a"/></linearGradient>
<radialGradient id="ball" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#f7ff9e"/><stop offset="1" stop-color="#c9d63a"/></radialGradient>
</defs>
<rect width="400" height="560" rx="18" fill="url(#bg)"/>
<text x="24" y="52" class="s tx b" font-size="28">PickleTime Bot</text>
<text x="24" y="80" class="s mu" font-size="14">Books your CourtReserve pickleball court</text>
<text x="24" y="100" class="s mu" font-size="14">the second it opens, from a Grok Bot.</text>

<g transform="translate(24 124)">
  <rect width="352" height="170" rx="10" fill="#0f2c26"/>
  <rect x="16" y="12" width="320" height="146" fill="url(#court)" stroke="#e9f3ee" stroke-width="2.5"/>
  <line x1="176" y1="12" x2="176" y2="158" stroke="#e9f3ee" stroke-width="3"/>
  <line x1="130" y1="12" x2="130" y2="158" stroke="#e9f3ee" stroke-width="2"/>
  <line x1="222" y1="12" x2="222" y2="158" stroke="#e9f3ee" stroke-width="2"/>
  <line x1="16" y1="85" x2="130" y2="85" stroke="#e9f3ee" stroke-width="2"/>
  <line x1="222" y1="85" x2="336" y2="85" stroke="#e9f3ee" stroke-width="2"/>
  <circle cx="270" cy="50" r="10" fill="url(#ball)"/>
</g>

<g transform="translate(24 312)">
  <rect width="352" height="52" rx="12" fill="#0e1a2e" stroke="#2a3d5e"/>
  <circle cx="22" cy="26" r="6" class="gr pulse"/>
  <text x="38" y="31" class="s fa" font-size="12">release</text>
  <text x="96" y="33" class="m tx b" font-size="20">12:00:00</text>
</g>

<g transform="translate(24 380)">
  <rect width="352" height="156" rx="16" fill="#0e1a2e" stroke="#2a3d5e"/>
  <circle cx="32" cy="32" r="14" fill="#1f6b5a"/>
  <circle cx="32" cy="32" r="6" fill="url(#ball)"/>
  <text x="56" y="30" class="s tx sb" font-size="13">PickleTime Bot</text>
  <text x="56" y="46" class="s fa" font-size="11">your Grok chat · 12:00</text>
  <rect x="16" y="62" width="320" height="80" rx="12" fill="#13253f"/>
  <text x="30" y="88" class="m gr b" font-size="14">BOOKED</text>
  <text x="94" y="88" class="m tx" font-size="14">Sat 21 Nov</text>
  <text x="30" y="110" class="m tx" font-size="14">6:30 PM for 60 min</text>
  <text x="30" y="130" class="m mu" font-size="11">fired 12:00:00.04 · sprint 0.9s</text>
</g>
</svg>
