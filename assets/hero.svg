<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
<title id="t">PickleTime Bot: automatic CourtReserve pickleball court booking for Grok Bot</title>
<desc id="d">A pickleball court seen from above, a clock reading 12:00:00, and a chat message from PickleTime Bot that reads: BOOKED Saturday 21 November at 6:30 PM for 60 minutes. The bot books your CourtReserve court the second it is released and tells you in your Grok chat.</desc>
<style>.s{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}.tx{fill:#eef3fb}.mu{fill:#a9b6cc}.fa{fill:#7f8ea8}.gr{fill:#7ee08a}.yl{fill:#e8f25c}.b{font-weight:700}.sb{font-weight:600}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pop{0%,55%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:translateY(0)}}.pop{animation:pop 6s ease-out infinite}@media (prefers-reduced-motion:reduce){.pulse,.pop{animation:none;opacity:1;transform:none}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1424"/><stop offset="1" stop-color="#11203a"/></linearGradient>
<linearGradient id="court" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f6b5a"/><stop offset="1" stop-color="#18574a"/></linearGradient>
<radialGradient id="ball" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#f7ff9e"/><stop offset="1" stop-color="#c9d63a"/></radialGradient>
</defs>
<rect width="800" height="400" rx="18" fill="url(#bg)"/>

<!-- title -->
<text x="40" y="70" class="s tx b" font-size="34">PickleTime Bot</text>
<text x="40" y="100" class="s mu" font-size="16">Books your CourtReserve pickleball court</text>
<text x="40" y="122" class="s mu" font-size="16">the second it opens, from a Grok Bot.</text>

<!-- court, top-down -->
<g transform="translate(40 150)">
  <rect width="300" height="210" rx="10" fill="#0f2c26"/>
  <rect x="20" y="15" width="260" height="180" fill="url(#court)" stroke="#e9f3ee" stroke-width="2.5"/>
  <line x1="150" y1="15" x2="150" y2="195" stroke="#e9f3ee" stroke-width="3"/>
  <line x1="150" y1="10" x2="150" y2="200" stroke="#0b1424" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="112" y1="15" x2="112" y2="195" stroke="#e9f3ee" stroke-width="2"/>
  <line x1="188" y1="15" x2="188" y2="195" stroke="#e9f3ee" stroke-width="2"/>
  <line x1="20" y1="105" x2="112" y2="105" stroke="#e9f3ee" stroke-width="2"/>
  <line x1="188" y1="105" x2="280" y2="105" stroke="#e9f3ee" stroke-width="2"/>
  <rect x="112" y="15" width="76" height="180" fill="#ffffff" opacity=".05"/>
  <text x="150" y="208" class="s fa" font-size="10" text-anchor="middle" dy="-2">kitchen</text>
  <circle cx="226" cy="62" r="11" fill="url(#ball)"/>
  <g fill="#9aa51f" opacity=".75"><circle cx="222" cy="58" r="1.6"/><circle cx="230" cy="60" r="1.6"/><circle cx="224" cy="67" r="1.6"/><circle cx="231" cy="67" r="1.6"/></g>
</g>

<!-- release clock -->
<g transform="translate(372 60)">
  <rect width="150" height="64" rx="12" fill="#0e1a2e" stroke="#2a3d5e"/>
  <circle cx="22" cy="32" r="6" class="gr pulse"/>
  <text x="38" y="28" class="s fa" font-size="11">release</text>
  <text x="38" y="48" class="m tx b" font-size="20">12:00:00</text>
</g>

<!-- chat -->
<g transform="translate(372 150)">
  <rect width="390" height="210" rx="16" fill="#0e1a2e" stroke="#2a3d5e"/>
  <circle cx="34" cy="36" r="16" fill="#1f6b5a"/>
  <circle cx="34" cy="36" r="7" fill="url(#ball)"/>
  <text x="60" y="33" class="s tx sb" font-size="14">PickleTime Bot</text>
  <text x="60" y="50" class="s fa" font-size="11">your Grok chat · 12:00</text>
  <g class="pop">
    <rect x="20" y="66" width="350" height="122" rx="12" fill="#13253f"/>
    <text x="36" y="94" class="m gr b" font-size="15">BOOKED</text>
    <text x="104" y="94" class="m tx" font-size="15">Sat 21 Nov</text>
    <text x="36" y="118" class="m tx" font-size="15">6:30 PM for 60 min</text>
    <text x="36" y="146" class="m mu" font-size="12">fired 12:00:00.04 · sprint 0.9s</text>
    <text x="36" y="168" class="m fa" font-size="12">rehearsed first · no double bookings</text>
  </g>
</g>
</svg>
