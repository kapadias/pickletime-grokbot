<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d">
<title id="t">How PickleTime Bot books a court</title>
<desc id="d">Every day a Grok routine starts at 11:15. On a day outside your play rotation the bot posts quiet and stops within seconds. On a play day it holds until 11:57, starts Chrome, logs in to CourtReserve and opens the booking date, then at 12:00:00 sprints through your preferred times and durations, books one court, and posts the result in your Grok chat.</desc>
<style>.s{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}.tx{fill:#eef3fb}.mu{fill:#a9b6cc}.fa{fill:#7f8ea8}.gr{fill:#7ee08a}.b{font-weight:700}.sb{font-weight:600}.box{fill:#0e1a2e;stroke:#2a3d5e}.hot{fill:#13253f;stroke:#7ee08a}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1424"/><stop offset="1" stop-color="#11203a"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9b6cc"/></marker>
</defs>
<rect width="800" height="300" rx="18" fill="url(#bg)"/>
<g stroke="#a9b6cc" stroke-width="1.6" fill="none" marker-end="url(#ar)">
  <line x1="166" y1="110" x2="190" y2="110"/>
  <line x1="342" y1="110" x2="366" y2="110"/>
  <line x1="518" y1="110" x2="542" y2="110"/>
  <line x1="268" y1="152" x2="268" y2="196"/>
</g>
<g class="s">
  <rect x="24" y="60" width="140" height="100" rx="12" class="box"/>
  <text x="40" y="88" class="tx sb" font-size="14">1 · Routine</text>
  <text x="40" y="112" class="m tx" font-size="16">11:15</text>
  <text x="40" y="134" class="mu" font-size="12">every day, early on</text>
  <text x="40" y="150" class="mu" font-size="12">purpose</text>

  <rect x="192" y="60" width="150" height="100" rx="12" class="box"/>
  <text x="208" y="88" class="tx sb" font-size="14">2 · Play day?</text>
  <text x="208" y="112" class="mu" font-size="12">your 14-day rotation</text>
  <text x="208" y="130" class="mu" font-size="12">and weekday windows</text>

  <rect x="368" y="60" width="150" height="100" rx="12" class="box"/>
  <text x="384" y="88" class="tx sb" font-size="14">3 · Warm up</text>
  <text x="384" y="112" class="m tx" font-size="16">11:57</text>
  <text x="384" y="134" class="mu" font-size="12">Chrome, login,</text>
  <text x="384" y="150" class="mu" font-size="12">open the date, arm</text>

  <rect x="544" y="60" width="232" height="100" rx="12" class="hot"/>
  <text x="560" y="88" class="tx sb" font-size="14">4 · Sprint and book</text>
  <text x="560" y="112" class="m gr b" font-size="16">12:00:00</text>
  <text x="560" y="134" class="mu" font-size="12">priority times, then durations;</text>
  <text x="560" y="150" class="mu" font-size="12">checks the form, books one court</text>

  <rect x="192" y="200" width="150" height="64" rx="12" class="box"/>
  <text x="208" y="226" class="tx sb" font-size="13">Off day</text>
  <text x="208" y="248" class="m mu" font-size="12">"quiet" in seconds</text>

  <rect x="368" y="200" width="408" height="64" rx="12" class="box"/>
  <text x="384" y="226" class="tx sb" font-size="13">Your Grok chat</text>
  <text x="384" y="248" class="m mu" font-size="12">BOOKED / NOT BOOKED / REHEARSAL, with timings</text>
  <line x1="660" y1="162" x2="660" y2="196" stroke="#a9b6cc" stroke-width="1.6" marker-end="url(#ar)"/>
</g>
<text x="24" y="36" class="s tx b" font-size="16">How it books a court</text>
</svg>
