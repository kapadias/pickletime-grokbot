<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560" role="img" aria-labelledby="t d">
<title id="t">How PickleTime Bot books a court</title>
<desc id="d">Every day a Grok routine starts at 11:15. Off days end with quiet in seconds. On a play day the bot warms up at 11:57, sprints at 12:00:00, books one court and posts the result in your Grok chat.</desc>
<style>.s{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}.tx{fill:#eef3fb}.mu{fill:#a9b6cc}.gr{fill:#7ee08a}.b{font-weight:700}.sb{font-weight:600}.box{fill:#0e1a2e;stroke:#2a3d5e}.hot{fill:#13253f;stroke:#7ee08a}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1424"/><stop offset="1" stop-color="#11203a"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a9b6cc"/></marker>
</defs>
<rect width="400" height="560" rx="18" fill="url(#bg)"/>
<text x="24" y="40" class="s tx b" font-size="16">How it books a court</text>
<g stroke="#a9b6cc" stroke-width="1.6" marker-end="url(#ar)">
  <line x1="200" y1="132" x2="200" y2="150"/><line x1="200" y1="232" x2="200" y2="250"/>
  <line x1="200" y1="332" x2="200" y2="350"/><line x1="200" y1="432" x2="200" y2="450"/>
</g>
<g class="s">
  <rect x="24" y="60" width="352" height="72" rx="12" class="box"/>
  <text x="40" y="88" class="tx sb" font-size="14">1 · Routine at <tspan class="m">11:15</tspan></text>
  <text x="40" y="112" class="mu" font-size="12">every day, deliberately early</text>
  <rect x="24" y="152" width="352" height="80" rx="12" class="box"/>
  <text x="40" y="180" class="tx sb" font-size="14">2 · Play day?</text>
  <text x="40" y="204" class="mu" font-size="12">your rotation decides; off days post</text>
  <text x="40" y="220" class="mu" font-size="12">"quiet" within seconds</text>
  <rect x="24" y="252" width="352" height="80" rx="12" class="box"/>
  <text x="40" y="280" class="tx sb" font-size="14">3 · Warm up at <tspan class="m">11:57</tspan></text>
  <text x="40" y="304" class="mu" font-size="12">Chrome, login, open the date, arm</text>
  <rect x="24" y="352" width="352" height="80" rx="12" class="hot"/>
  <text x="40" y="380" class="tx sb" font-size="14">4 · Sprint at <tspan class="m gr b">12:00:00</tspan></text>
  <text x="40" y="404" class="mu" font-size="12">priority times and durations; checks</text>
  <text x="40" y="420" class="mu" font-size="12">the form, books one court</text>
  <rect x="24" y="452" width="352" height="80" rx="12" class="box"/>
  <text x="40" y="480" class="tx sb" font-size="14">Your Grok chat</text>
  <text x="40" y="504" class="m mu" font-size="12">BOOKED / NOT BOOKED / REHEARSAL</text>
</g>
</svg>
