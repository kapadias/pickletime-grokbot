# PickleTime Bot: a new booking schedule, not set up yet.
#
# install.sh copies this file to /workspace/pickletime-desk/config.yaml once and
# never overwrites it. It deliberately names no club: the bot refuses to book
# until one is set, so a fresh bot can never book at somebody else's club.
#
# Set it up by telling the Bot "set up my schedule". It asks for your club's
# booking link, your days and times, shows you the result, and writes this file
# after your tap (run.sh schedule propose / apply). Every key, with its default:
# config/config.sample.yaml.
#
# Credentials never live here: USERID and PASSWORD come from the secret card.

# --- your club (set by "set up my schedule") ---------------------------------
# organization_id: 12345      # the number in your club's CourtReserve booking link
# sport_id: 678               # the sId=... in that link
sport_name: "Pickleball"
court_type: "Pickleball"

# --- when courts open ---------------------------------------------------------
timezone: "America/Los_Angeles"
release_time: "12:00 PM"      # when the club opens the furthest bookable day
days_in_advance: 7            # how many days ahead members may book

# --- what to book -------------------------------------------------------------
search_start_time: "6:00 PM"
search_end_time: "8:00 PM"
time_increment: 30
preferred_durations: [60, 30]
booking_priority: "duration"
# priority_time_slots: ["6:30 PM", "7:00 PM"]
# rotation:                   # omit to play every day
#   anchor_date: "01/05/2026" # a Monday
#   cycle_days: 7
#   play_on_offsets: [0, 3]   # Monday and Thursday

# --- the race -----------------------------------------------------------------
sprint_seconds: 25
release_grace_seconds: 180
poll_interval_ms: 150
max_retries: 1
retry_interval: 5

# --- browser ------------------------------------------------------------------
headless: true
webdriver_timeout: 15
page_load_timeout: 30
block_images: true

dry_run: false
