name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests scripts
      - name: Types
        run: mypy
      - name: Tests (unit and end-to-end; the runner image ships Chrome)
        run: pytest
      - name: Template hashes and release pins agree
        run: python scripts/check_template.py
      - name: Shell scripts parse
        run: bash -n scripts/install.sh scripts/run.sh scripts/env.sh

  install-and-doctor:
    # The real thing: install into a throwaway desk and book on the fake site,
    # exactly as the Grok Bot does on its first run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install
        run: PT_DESK=$RUNNER_TEMP/desk bash scripts/install.sh
      - name: Doctor with fake-site booking
        run: |
          PT_DESK=$RUNNER_TEMP/desk USERID=ci@example.com PASSWORD=unused \
            bash scripts/run.sh doctor --full | tee doctor.out
          grep -q '^\[PASS\] fake_site_booking' doctor.out
